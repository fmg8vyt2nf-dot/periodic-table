<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Periodic Table</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#0f0f12;color:#e8e8e8;min-height:100vh;padding:16px;}
h1{font-size:18px;font-weight:500;margin-bottom:12px;color:#fff;letter-spacing:0.02em;}
#controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
#search{width:160px;font-size:13px;padding:4px 8px;height:30px;border-radius:6px;border:0.5px solid #444;background:#1e1e24;color:#e8e8e8;outline:none;}
#search:focus{border-color:#888;}
#grid{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;width:100%;}
.cell{width:100%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:3px;cursor:pointer;transition:transform 0.12s,z-index 0s;position:relative;border:0.5px solid transparent;user-select:none;}
.cell:hover{transform:scale(1.15);z-index:100;box-shadow:0 3px 12px rgba(0,0,0,0.5);}
.cell.dimmed{opacity:0.12;}
.cell .num{font-size:6px;line-height:1;opacity:0.75;align-self:flex-start;padding:2px 0 0 2px;position:absolute;top:0;left:0;}
.cell .sym{font-size:clamp(9px,1.8vw,14px);font-weight:600;line-height:1;}
.cell .nm{font-size:clamp(4px,0.7vw,6px);opacity:0.7;overflow:hidden;white-space:nowrap;width:100%;text-align:center;padding:0 1px;}
.placeholder{opacity:0;pointer-events:none;aspect-ratio:1;}
#detail{margin-top:14px;background:#1e1e24;border:0.5px solid #333;border-radius:12px;padding:16px 20px;display:none;}
#detail.show{display:flex;gap:24px;flex-wrap:wrap;}
#dl{min-width:110px;}
#ds{font-size:52px;font-weight:700;line-height:1;}
#dn{font-size:20px;font-weight:500;margin:4px 0 3px;}
#dc{font-size:11px;padding:3px 10px;border-radius:99px;display:inline-block;margin-bottom:6px;}
#dnum{font-size:12px;color:#888;}
#dr{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;flex:1;align-content:start;}
.drow label{font-size:10px;color:#666;display:block;}
.drow span{font-size:13px;font-weight:500;color:#e8e8e8;}
#legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:#888;cursor:pointer;padding:3px 6px;border-radius:4px;transition:background 0.1s;}
.li:hover{background:#2a2a30;}
.li.active{color:#e8e8e8;background:#2a2a30;}
.ld{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.gap-row{grid-column:1/-1;height:4px;}
.lf-label{display:flex;align-items:center;justify-content:center;font-size:7px;color:#666;writing-mode:horizontal-tb;border-radius:3px;background:#1e1e24;aspect-ratio:auto;padding:2px;}
</style>
</head>
<body>
<h1>Periodic Table of Elements</h1>
<div id="controls">
  <input id="search" type="text" placeholder="Search element..." />
</div>
<div id="grid"></div>
<div id="legend"></div>
<div id="detail">
  <div id="dl">
    <div id="ds"></div>
    <div id="dn"></div>
    <div id="dc"></div>
    <div id="dnum"></div>
  </div>
  <div id="dr">
    <div class="drow"><label>Atomic mass</label><span id="d-mass"></span></div>
    <div class="drow"><label>Electron config</label><span id="d-ec"></span></div>
    <div class="drow"><label>Electronegativity</label><span id="d-en"></span></div>
    <div class="drow"><label>Melting point</label><span id="d-mp"></span></div>
    <div class="drow"><label>Boiling point</label><span id="d-bp"></span></div>
    <div class="drow"><label>Density</label><span id="d-dn"></span></div>
    <div class="drow"><label>Discovered</label><span id="d-yr"></span></div>
    <div class="drow"><label>State at 25°C</label><span id="d-st"></span></div>
  </div>
</div>

let activeFilter=null;

function buildGrid(filter){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const cells={};
  EL.forEach(e=>{cells[e.r+'-'+e.c]=e;});

  for(let row=1;row<=10;row++){
    if(row===8){
      const gap=document.createElement('div');
      gap.className='gap-row';
      grid.appendChild(gap);
      continue;
    }
    for(let col=1;col<=18;col++){
      const el=cells[row+'-'+col];
      const cell=document.createElement('div');
      if(!el){
        cell.className='placeholder';
        cell.style.cssText='width:100%;aspect-ratio:1;';
      } else {
        const cat=CATS[el.cat];
        cell.className='cell';
        cell.style.background=cat.bg;
        cell.style.color='#fff';
        if(filter&&el.cat!==filter)cell.classList.add('dimmed');
        cell.innerHTML='<span class="num">'+el.n+'</span><span class="sym">'+el.sym+'</span><span class="nm">'+el.name+'</span>';
        cell.addEventListener('click',()=>showDetail(el));
        cell.title=el.name+' ('+el.n+')';
      }
      grid.appendChild(cell);
    }
  }
}

function showDetail(el){
  const cat=CATS[el.cat];
  document.getElementById('ds').textContent=el.sym;
  document.getElementById('ds').style.color=cat.bg;
  document.getElementById('dn').textContent=el.name;
  const badge=document.getElementById('dc');
  badge.textContent=cat.label;
  badge.style.background=cat.bg+'33';
  badge.style.color=cat.bg;
  document.getElementById('dnum').textContent='Atomic number: '+el.n;
  document.getElementById('d-mass').textContent=el.mass+' u';
  document.getElementById('d-ec').textContent=el.ec;
  document.getElementById('d-en').textContent=el.en;
  document.getElementById('d-mp').textContent=el.mp;
  document.getElementById('d-bp').textContent=el.bp;
  document.getElementById('d-dn').textContent=el.dn;
  document.getElementById('d-yr').textContent=el.yr;
  document.getElementById('d-st').textContent=el.st;
  document.getElementById('detail').classList.add('show');
}

function buildLegend(){
  const leg=document.getElementById('legend');
  Object.entries(CATS).forEach(([key,cat])=>{
    const item=document.createElement('div');
    item.className='li';
    item.innerHTML='<div class="ld" style="background:'+cat.bg+'"></div>'+cat.label;
    item.addEventListener('click',()=>{
      activeFilter=(activeFilter===key)?null:key;
      document.querySelectorAll('.li').forEach(li=>li.classList.remove('active'));
      if(activeFilter)item.classList.add('active');
      buildGrid(activeFilter);
    });
    leg.appendChild(item);
  });
}

document.getElementById('search').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.cell').forEach(cell=>{
    const sym=cell.querySelector('.sym')?.textContent.toLowerCase()||'';
    const nm=cell.querySelector('.nm')?.textContent.toLowerCase()||'';
    const num=cell.querySelector('.num')?.textContent||'';
    if(!q){cell.classList.remove('dimmed');return;}
    if(sym.includes(q)||nm.includes(q)||num===q)cell.classList.remove('dimmed');
    else cell.classList.add('dimmed');
  });
});

buildGrid(null);
buildLegend();
</script>
